<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<div id="container"></div>
<script>
(function() {
  var selectedSections = [];
  var lastHash = 0;

  // ── Streamlit postMessage protocol (no external lib needed) ───────────────
  function sendToStreamlit(type, data) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(msg, "*");
  }

  function sendValue(val) {
    sendToStreamlit("streamlit:setComponentValue", { value: val, dataType: "json" });
  }

  function sendHeight(h) {
    sendToStreamlit("streamlit:setFrameHeight", { height: h });
  }

  // ── Simple hash to avoid re-rendering SVG if nothing changed ──────────────
  function hash(s) {
    var h = 0;
    var len = Math.min(s.length, 8000);
    for (var i = 0; i < len; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return h;
  }

  // ── Apply/remove yellow highlight borders on sections ─────────────────────
  function applyHighlights() {
    document.querySelectorAll('[data-grp].selected').forEach(function(el) {
      el.classList.remove('selected');
    });
    selectedSections.forEach(function(grp) {
      var el = document.querySelector('[data-grp="' + grp + '"]');
      if (el) el.classList.add('selected');
    });
  }

  // ── Attach click handlers to every section group element ──────────────────
  function setupClickHandlers() {
    document.querySelectorAll('[data-grp]').forEach(function(s) {
      if (s.dataset.stReady) return;   // avoid double-attaching
      s.dataset.stReady = '1';
      s.addEventListener('click', function(e) {
        e.stopPropagation();
        var grp = this.getAttribute('data-grp');
        if (!grp) return;
        var idx = selectedSections.indexOf(grp);
        if (idx >= 0) {
          selectedSections.splice(idx, 1);
          this.classList.remove('selected');
        } else {
          selectedSections.push(grp);
          this.classList.add('selected');
        }
        sendValue(selectedSections.slice());  // send updated list to Python
      });
    });
  }

  // ── Inject HTML and re-execute any inline <script> tags ───────────────────
  function injectSvg(svgHtml) {
    var container = document.getElementById('container');
    container.innerHTML = svgHtml;
    // innerHTML does not execute scripts — replace each one with a new node
    container.querySelectorAll('script').forEach(function(oldScript) {
      var newScript = document.createElement('script');
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  // ── Handle render message from Streamlit ─────────────────────────────────
  function onRender(data) {
    var args      = data.args || {};
    var svgHtml   = args.svg_html || '';
    selectedSections = (args.selected || []).slice();

    var newHash = hash(svgHtml);
    if (newHash !== lastHash) {
      lastHash = newHash;
      injectSvg(svgHtml);
      // Give SVG scripts time to execute, then attach our handlers on top
      setTimeout(function() {
        setupClickHandlers();
        applyHighlights();
        var h = document.getElementById('container').scrollHeight || 1200;
        sendHeight(h);
      }, 100);
    } else {
      // SVG unchanged — only update visual highlights (section toggle)
      applyHighlights();
    }
  }

  // ── Listen for Streamlit render events ────────────────────────────────────
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "streamlit:render") {
      onRender(event.data);
    }
  });

  // ── Signal to Streamlit that the component is ready ───────────────────────
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  sendHeight(1200);
})();
</script>
</body>
</html>
